name: Build Android APK

on:
  push:
    branches: [ main, master, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev libffi-dev ccache libssl-dev expect

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        run: |
          buildozer -v android debug || { echo "--- HATA DETAYI (SON 50 SATIR) ---"; tail -n 50 ~/.buildozer/android/platform/build-*/build/other_builds/hostpython3/desktop/hostpython3/buildozer.log 2>/dev/null || true; exit 1; }

      - name: Copy and Locate APK
        run: |
          mkdir -p final_apk
          find . -name "*.apk" -exec cp -v {} final_apk/ \;
          ls -la final_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: final_apk/
          
