name: Build Android APK

on:
  push:
    branches: [ main, master, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev libffi-dev ccache libssl-dev android-sdk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        run: |
          buildozer -v android debug --p4a.accept_sdk_license=True

      - name: Prepare APK for Artifact
        run: |
          mkdir -p final_apk
          cp -v bin/*.apk final_apk/ 2>/dev/null || find . -name "*.apk" -exec cp -v {} final_apk/ \; || true
          echo "Bulunan APK dosyaları:"
          ls -la final_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: final_apk/
          
